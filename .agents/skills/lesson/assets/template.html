<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TITLE</title>
		<style>
			:root {
				--bg: #ffffff;
				--panel: #f6f8fa;
				--line: #d0d7de;
				--text: #1f2328;
				--muted: #59636e;
				--accent: #0969da;
				--good: #1a7f37;
				--bad: #cf222e;
				--warn: #9a6700;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font:
					15.5px/1.7 system-ui,
					sans-serif;
			}
			header {
				padding: 28px 28px 0;
				max-width: 820px;
				margin: 0 auto;
			}
			h1 {
				margin: 0 0 6px;
				font-size: 26px;
				line-height: 1.25;
			}
			nav {
				display: flex;
				gap: 2px;
				padding: 0 20px;
				border-bottom: 1px solid var(--line);
				flex-wrap: wrap;
				justify-content: center;
				max-width: 1020px;
				margin: 0 auto;
			}
			nav button {
				background: none;
				border: 0;
				border-bottom: 2px solid transparent;
				color: var(--muted);
				padding: 10px 8px;
				font: inherit;
				font-size: 14px;
				cursor: pointer;
			}
			nav button.active {
				color: var(--text);
				border-bottom-color: var(--accent);
			}
			section {
				display: none;
				padding: 24px 28px 64px;
				max-width: 820px;
				margin: 0 auto;
			}
			section.active {
				display: block;
			}
			h2 {
				font-size: 22px;
				margin: 40px 0 8px;
			}
			h3 {
				font-size: 17px;
				margin: 28px 0 6px;
			}
			p {
				margin: 0 0 14px;
			}
			ul,
			ol {
				margin: 6px 0 16px;
				padding-left: 22px;
			}
			li {
				margin: 4px 0;
			}

			/* Shared components: keep this block identical in the lesson and output-html templates. */
			code {
				font-family: ui-monospace, monospace;
				font-size: 0.9em;
				background: var(--panel);
				padding: 1px 5px;
				border-radius: 4px;
			}
			pre {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 12px 14px;
				overflow-x: auto;
				font:
					13px/1.55 ui-monospace,
					monospace;
				margin: 12px 0;
			}
			pre code {
				background: none;
				padding: 0;
				font-size: inherit;
			}
			mark {
				background: #fff8c5;
				color: inherit;
				padding: 0 2px;
				border-radius: 3px;
			}

			/* Code: file caption, tabs between files, printed output */
			.codefile {
				margin: 12px 0;
			}
			.codefile figcaption {
				font:
					12px ui-monospace,
					monospace;
				color: var(--muted);
				background: var(--panel);
				border: 1px solid var(--line);
				border-bottom: 0;
				border-radius: 6px 6px 0 0;
				padding: 6px 14px;
			}
			.codefile pre {
				margin: 0;
				border-radius: 0 0 6px 6px;
				background: var(--bg);
			}
			.codegroup figcaption {
				display: flex;
				gap: 2px;
				padding: 0 6px;
				overflow-x: auto;
			}
			.codegroup figcaption button {
				background: none;
				border: 0;
				border-bottom: 2px solid transparent;
				color: var(--muted);
				font: inherit;
				padding: 6px 8px;
				cursor: pointer;
			}
			.codegroup figcaption button.active {
				color: var(--text);
				border-bottom-color: var(--accent);
			}
			pre.out {
				background: var(--bg);
				border-style: dashed;
			}
			pre.err {
				background: #fff8f8;
				border-color: #ffcecb;
			}

			/* Numbered lines for <pre data-lines>; widgets may toggle .hl, .dim, .bad and .good on each .line */
			pre[data-lines] {
				counter-reset: line;
			}
			pre .line {
				display: block;
				min-height: 1.55em;
				margin: 0 -14px;
				padding: 0 14px;
				transition:
					background 0.2s,
					opacity 0.2s;
			}
			pre .line::before {
				counter-increment: line;
				content: counter(line);
				display: inline-block;
				width: 2em;
				margin-right: 12px;
				text-align: right;
				color: var(--muted);
				user-select: none;
			}
			pre .line.hl {
				background: #fff8c5;
			}
			pre .line.dim {
				opacity: 0.35;
			}
			pre .line.bad {
				background: #ffebe9;
				color: inherit;
				font-weight: inherit;
			}
			pre .line.good {
				background: #dafbe1;
			}

			/* Command to run, with a copy button */
			pre.cmd {
				position: relative;
				background: var(--text);
				border-color: var(--text);
				color: #e6edf3;
				padding: 10px 70px 10px 14px;
			}
			.cmd span {
				color: #8b949e;
				user-select: none;
			}
			.cmd .copy {
				position: absolute;
				top: 6px;
				right: 6px;
				font:
					11px system-ui,
					sans-serif;
				background: #30363d;
				color: #e6edf3;
				border: 0;
				border-radius: 4px;
				padding: 3px 8px;
				cursor: pointer;
			}

			/* Notes and warnings */
			.note {
				border-left: 3px solid var(--accent);
				background: #ddf4ff;
				padding: 10px 14px;
				border-radius: 0 6px 6px 0;
				margin: 12px 0;
			}
			.note.warn {
				border-left-color: var(--warn);
				background: #fff8c5;
			}
			.note > :last-child {
				margin-bottom: 0;
			}

			/* Text diagrams: file tree and free-form boxes */
			pre.tree em {
				color: var(--muted);
				font-style: normal;
			}
			/* Menlo and Consolas carry box-drawing characters, so lines and corners meet. */
			pre.diagram {
				background: var(--bg);
				font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace;
				line-height: 1.2;
			}

			/* Tables: plain, fields of a type, test cases, config changes */
			table {
				border-collapse: collapse;
				width: 100%;
				margin: 12px 0;
			}
			th,
			td {
				border: 1px solid var(--line);
				padding: 6px 10px;
				text-align: left;
				vertical-align: top;
			}
			th {
				background: var(--panel);
			}
			.fields code:first-child {
				font-weight: 600;
			}
			.fields .type {
				font-family: ui-monospace, monospace;
				color: #953800;
			}
			.fields .opt {
				color: var(--muted);
				font-size: 0.85em;
			}
			.cases tr.fail td {
				background: #ffebe9;
			}
			.cases .pass {
				color: var(--good);
			}
			.cases .failed {
				color: var(--bad);
			}
			del {
				color: var(--bad);
			}
			ins {
				color: var(--good);
				text-decoration: none;
			}

			/* Disclosure for detail most readers skip */
			details {
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 8px 14px;
				margin: 12px 0;
			}
			summary {
				cursor: pointer;
				font-weight: 600;
			}
			details p {
				margin: 8px 0 0;
			}

			/* Lists: trade-offs, numbered steps, checklist, decision tree */
			.pro::marker {
				content: "+  ";
				color: var(--good);
			}
			.con::marker {
				content: "−  ";
				color: var(--bad);
			}
			.steps {
				counter-reset: step;
				list-style: none;
				padding: 0;
				margin: 12px 0 12px 11px;
			}
			.steps li {
				counter-increment: step;
				position: relative;
				margin: 0;
				padding: 0 0 14px 24px;
				border-left: 2px solid var(--line);
			}
			.steps li:last-child {
				border-left-color: transparent;
			}
			.steps li::before {
				content: counter(step);
				position: absolute;
				left: -12px;
				top: 0;
				width: 22px;
				height: 22px;
				border-radius: 50%;
				background: var(--accent);
				color: #fff;
				font-size: 12px;
				line-height: 22px;
				text-align: center;
			}
			.steps .steps {
				counter-reset: substep;
				margin-top: 10px;
			}
			.steps .steps li {
				counter-increment: substep;
			}
			.steps .steps li::before {
				content: counter(step) counter(substep, lower-alpha);
				background: var(--bg);
				color: var(--accent);
				border: 1px solid var(--accent);
				font-size: 11px;
				line-height: 20px;
			}
			.checks {
				list-style: none;
				padding-left: 0;
			}
			.checks li::before {
				content: "☐  ";
				color: var(--muted);
			}
			.checks li.done::before {
				content: "☑  ";
				color: var(--good);
			}
			.checks .checks {
				padding-left: 22px;
				margin: 2px 0;
			}
			.dtree,
			.dtree ul {
				list-style: none;
				margin: 4px 0;
			}
			.dtree {
				padding-left: 0;
			}
			.dtree ul {
				padding-left: 18px;
				border-left: 1px solid var(--line);
				margin-left: 6px;
			}
			.dtree li {
				margin: 4px 0;
			}
			.dtree em {
				color: var(--accent);
				font-style: normal;
				font-size: 12px;
				margin-right: 6px;
			}

			/* Flows: pipeline, sequence, timeline, state transitions */
			.flow {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
				margin: 12px 0;
			}
			.flow span {
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 6px 12px;
				background: var(--panel);
			}
			.flow i {
				color: var(--muted);
				font-style: normal;
			}
			.seq {
				position: relative;
				overflow: hidden;
				display: grid;
				grid-template-columns: repeat(var(--actors, 3), 1fr);
				row-gap: 10px;
				margin: 12px 0;
				padding-bottom: 8px;
			}
			.seq b {
				position: relative;
				justify-self: center;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 4px 12px;
			}
			.seq b::after {
				content: "";
				position: absolute;
				top: 100%;
				left: 50%;
				height: 100vh;
				border-left: 1px solid var(--line);
			}
			.seq .msg {
				grid-column: var(--from) / span var(--span);
				margin: 0 calc(50% / var(--span));
				border-bottom: 1px solid var(--muted);
				text-align: center;
				font-size: 12px;
				position: relative;
			}
			.seq .msg::after {
				content: "▶";
				position: absolute;
				right: -6px;
				bottom: -8px;
				font-size: 9px;
				color: var(--muted);
			}
			.seq .msg.back::after {
				content: "◀";
				right: auto;
				left: -6px;
			}
			.timeline {
				display: flex;
				margin: 12px 0 16px;
				border-top: 2px solid var(--line);
			}
			.timeline div {
				flex: 1;
				position: relative;
				padding-top: 14px;
				font-size: 13px;
			}
			.timeline div::before {
				content: "";
				position: absolute;
				top: -7px;
				left: 0;
				width: 12px;
				height: 12px;
				border-radius: 50%;
				background: var(--accent);
			}
			.timeline div.next::before {
				background: var(--bg);
				border: 2px solid var(--accent);
			}
			.timeline time {
				display: block;
				color: var(--muted);
				font-size: 12px;
			}
			.transitions {
				display: grid;
				gap: 6px;
				margin: 12px 0;
			}
			.transitions div {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
			}
			.transitions b {
				font-weight: 500;
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 2px 10px;
				background: var(--panel);
			}
			.transitions i {
				font-style: normal;
				font-size: 12px;
				color: var(--muted);
			}

			/* Numbers: bars, proportion, scale with thresholds, sparkline */
			.meter-row {
				display: grid;
				grid-template-columns: 140px 1fr 48px;
				gap: 10px;
				align-items: center;
				margin: 4px 0;
			}
			.meter {
				height: 8px;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 4px;
				overflow: hidden;
			}
			.meter i {
				display: block;
				height: 100%;
				background: var(--accent);
			}
			.split {
				display: flex;
				height: 14px;
				border-radius: 4px;
				overflow: hidden;
				margin: 12px 0 6px;
			}
			.split span {
				background: var(--swatch);
			}
			.legend {
				display: flex;
				flex-wrap: wrap;
				gap: 4px 14px;
				font-size: 12px;
				color: var(--muted);
			}
			.legend span::before {
				content: "";
				display: inline-block;
				width: 10px;
				height: 10px;
				border-radius: 2px;
				margin-right: 6px;
				background: var(--swatch);
			}
			.c1 {
				--swatch: #0969da;
			}
			.c2 {
				--swatch: #8250df;
			}
			.c3 {
				--swatch: #bf8700;
			}
			.c4 {
				--swatch: #d0d7de;
			}
			/* --ok-at and --warn-at set where the scale turns from good to warn to bad. */
			.scale {
				position: relative;
				height: 8px;
				border-radius: 4px;
				margin: 14px 0 6px;
				background: linear-gradient(
					to right,
					var(--good) 0 var(--ok-at),
					#bf8700 var(--ok-at) var(--warn-at),
					var(--bad) var(--warn-at)
				);
			}
			.scale i {
				position: absolute;
				top: -5px;
				width: 3px;
				height: 18px;
				border-radius: 2px;
				background: var(--text);
			}
			.scale i span {
				position: absolute;
				top: 20px;
				left: 50%;
				transform: translateX(-50%);
				font-size: 12px;
				font-style: normal;
				white-space: nowrap;
			}
			.scale-labels {
				display: flex;
				justify-content: space-between;
				margin-top: 18px;
				font-size: 12px;
				color: var(--muted);
			}
			.spark {
				vertical-align: middle;
			}
			.spark polyline {
				fill: none;
				stroke: var(--accent);
				stroke-width: 1.5;
			}

			/* Design: wireframe and color swatches */
			.wire {
				display: grid;
				grid-template-columns: 1fr 3fr;
				grid-template-rows: auto 120px;
				gap: 6px;
				max-width: 480px;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 6px;
				margin: 12px 0;
			}
			.wire div {
				border: 1px dashed var(--line);
				border-radius: 4px;
				padding: 6px 8px;
				font-size: 12px;
				color: var(--muted);
			}
			.wire .top {
				grid-column: 1 / -1;
			}
			.wire .focus {
				border: 1px solid var(--accent);
				background: #ddf4ff;
				color: var(--text);
			}
			.swatches {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
				gap: 8px;
				margin: 12px 0;
			}
			.swatches div {
				border: 1px solid var(--line);
				border-radius: 6px;
				overflow: hidden;
				font-size: 12px;
			}
			.swatches i {
				display: block;
				height: 40px;
			}
			.swatches span {
				display: block;
				padding: 4px 8px;
			}
			.swatches code {
				color: var(--muted);
				font-size: 11px;
			}

			/* Editor links that open a file in VS Code */
			a.ref {
				font-family: ui-monospace, monospace;
				font-size: 0.9em;
				color: var(--accent);
				text-decoration: none;
				border-bottom: 1px dotted var(--accent);
			}
			/* Media: image, GIF or video embedded as a data: URL, with optional callouts drawn over a screenshot */
			.media {
				margin: 12px 0;
			}
			.media.phone {
				max-width: 320px;
			}
			.media img,
			.media video {
				display: block;
				width: 100%;
				height: auto;
				border: 1px solid var(--line);
				border-radius: 6px;
			}
			.media figcaption {
				color: var(--muted);
				font-size: 12px;
				margin-top: 6px;
			}
			.shot {
				position: relative;
			}
			/* The SVG's viewBox is the image's size in pixels, so callout numbers are image pixels. */
			.shot svg {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
			}
			.shot ellipse,
			.shot rect {
				fill: none;
				stroke: var(--bad);
				stroke-width: 4;
			}
			/* End shared components. */

			/* Lesson components */
			/* Blog furniture */
			.toc {
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 10px 16px;
				margin: 0 0 24px;
				font-size: 14px;
			}
			.toc b {
				display: block;
				color: var(--muted);
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				margin-bottom: 2px;
			}
			.toc a {
				color: var(--accent);
				text-decoration: none;
			}
			.toc ol {
				margin: 0;
				padding-left: 20px;
			}
			.learn {
				background: var(--panel);
				border-radius: 8px;
				padding: 12px 18px;
				margin: 0 0 20px;
			}
			.learn ul {
				margin: 4px 0 0;
			}
			.ask {
				display: flex;
				gap: 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 12px 14px;
				margin: 0 0 16px;
			}
			.ask .who {
				font-size: 20px;
				line-height: 1.2;
			}
			.ask > div:last-child {
				min-width: 0;
			}
			.ask p {
				margin: 0 0 6px;
			}
			.ask p:last-child {
				margin: 0;
			}
			.ask .q {
				font-weight: 600;
				margin-bottom: 4px;
			}
			.ask pre {
				margin: 6px 0 8px;
			}

			/* Exercise and next lesson */
			.exercise {
				border: 1px solid var(--line);
				border-left: 3px solid var(--good);
				border-radius: 0 8px 8px 0;
				padding: 12px 16px;
				margin: 0 0 20px;
			}
			.exercise > p:first-child {
				font-weight: 600;
			}
			.exercise details {
				border: 0;
				padding: 0;
				margin: 6px 0 0;
			}
			.exercise summary {
				cursor: pointer;
				color: var(--accent);
				font-size: 14px;
				font-weight: 600;
				margin-bottom: 10px;
			}
			.next {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 12px 16px;
				margin-top: 24px;
				background: var(--panel);
			}
			.next p {
				margin: 0;
			}

			/* Widgets */
			.widget {
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 16px;
				margin: 4px 0 20px;
				background: #fbfcfd;
			}
			.widget .hint {
				font-size: 13px;
				color: var(--muted);
				margin: 0 0 10px;
			}
			.widget pre {
				margin: 0 0 10px;
			}
			.row {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				align-items: center;
				margin-bottom: 10px;
			}
			.btn {
				border: 1px solid var(--line);
				background: var(--bg);
				border-radius: 6px;
				padding: 5px 12px;
				font: inherit;
				font-size: 13.5px;
				cursor: pointer;
			}
			.btn:hover {
				border-color: var(--accent);
			}
			.btn.primary {
				background: var(--accent);
				color: #fff;
				border-color: var(--accent);
			}
			.btn.on {
				background: #ddf4ff;
				border-color: var(--accent);
				color: var(--accent);
			}
			.btn:disabled {
				opacity: 0.45;
				cursor: default;
			}
			.btn code {
				background: none;
				padding: 0;
			}
			.seg {
				display: inline-flex;
				flex-wrap: wrap;
				gap: 4px;
				vertical-align: middle;
			}
			.seg button {
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--bg);
				padding: 4px 10px;
				font:
					13px ui-monospace,
					monospace;
				cursor: pointer;
			}
			.seg button:hover {
				border-color: var(--accent);
			}
			.seg button.on {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			.status {
				font-size: 14px;
				background: var(--panel);
				border-radius: 6px;
				padding: 8px 10px;
				min-height: 40px;
			}
			.status pre {
				margin: 8px 0 0;
			}
			.counter {
				font-size: 12px;
				color: var(--muted);
				margin-left: auto;
			}
			.bad {
				color: var(--bad);
				font-weight: 600;
			}
			.ok {
				color: var(--good);
				font-weight: 600;
			}
			.empty {
				color: var(--muted);
				font-size: 13px;
				font-style: italic;
			}
			.stats {
				display: flex;
				gap: 16px;
				font-size: 13px;
				color: var(--muted);
				margin-top: 8px;
				flex-wrap: wrap;
			}
			.stats b {
				color: var(--text);
				font-size: 15px;
			}
			.lesson-tag {
				display: inline-block;
				font-size: 11px;
				background: #ddf4ff;
				color: var(--accent);
				border-radius: 10px;
				padding: 0 8px;
				margin-left: 6px;
				font-weight: 600;
				vertical-align: 1px;
			}

			/* Shared mobile breakpoint: use 640px for all mobile layout rules. */
			.nav-toggle {
				display: none;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--bg);
				color: var(--text);
				padding: 10px 14px;
				margin: 12px 20px;
				font: inherit;
				cursor: pointer;
			}
			@media (max-width: 640px) {
				.nav-toggle {
					display: inline-flex;
					align-items: center;
					gap: 8px;
				}
				nav.mobile-nav {
					display: none;
					flex-direction: column;
					align-items: stretch;
					padding: 0;
				}
				nav.mobile-nav.open {
					display: flex;
				}
				/* An open menu fills the screen below the header; page content hides until it closes. */
				body.nav-open {
					display: flex;
					flex-direction: column;
					min-height: 100dvh;
				}
				body.nav-open > :not(header, nav) {
					display: none;
				}
				body.nav-open > nav:last-of-type {
					flex: 1;
				}
				nav.mobile-nav button {
					display: flex;
					justify-content: space-between;
					align-items: center;
					text-align: left;
					padding: 14px 16px;
					border-bottom: 0;
				}
				nav.mobile-nav button.active::after {
					content: "✓";
					color: var(--text);
				}
				/* The menu toggle sits in the header, to the right of the title. */
				header {
					display: grid;
					grid-template-columns: minmax(0, 1fr) auto;
					column-gap: 12px;
					align-items: center;
					padding: 16px 16px 12px;
					border-bottom: 1px solid var(--line);
				}
				header > :not(.nav-toggle) {
					grid-column: 1;
				}
				header h1 {
					margin: 0;
				}
				header > .nav-toggle {
					grid-column: 2;
					grid-row: 1;
					margin: 0;
				}
				section {
					padding: 20px 16px 40px;
				}
			}
			@media print {
				nav,
				.nav-toggle {
					display: none;
				}
				section {
					display: block;
				}
			}
		</style>
	</head>

		</script>
		<script type="module">
			/**
			 * Highlight code in every <pre> with Shiki: VS Code's own grammars and its
			 * "GitHub Light Default" theme. The language comes from `data-lang`, else from
			 * the file extension in the code's caption; code with no known language stays plain.
			 * Every file loads from jsDelivr, pinned by the SHA in the import map above.
			 * Without network the code stays plain.
			 *
			 * @see {@link https://shiki.style/guide/install#fine-grained-bundle Shiki: fine-grained bundle}
			 */
			import { createHighlighterCore } from "@shikijs/core";
			import { createJavaScriptRegexEngine } from "@shikijs/engine-javascript";

			const THEME = "github-light-default";
			const ITALIC = 1;
			const BOLD = 2;
			const UNDERLINE = 4;

			// Shiki language for each `data-lang` value or file extension the import map pins
			const LANG_BY_NAME = {
				bash: "shellscript",
				cjs: "javascript",
				css: "css",
				cts: "typescript",
				diff: "diff",
				html: "html",
				js: "javascript",
				json: "json",
				jsonc: "json",
				jsx: "jsx",
				markdown: "markdown",
				md: "markdown",
				mjs: "javascript",
				mts: "typescript",
				patch: "diff",
				py: "python",
				python: "python",
				sh: "shellscript",
				shell: "shellscript",
				sql: "sql",
				svelte: "svelte",
				toml: "toml",
				ts: "typescript",
				tsx: "tsx",
				typescript: "typescript",
				yaml: "yaml",
				yml: "yaml",
				zsh: "shellscript",
			};

			/**
			 * Find the file path shown with a <pre>: its `.codefile` caption, or its tab in a code group.
			 */
			const captionFor = (pre) => {
				const figure = pre.closest("figure.codefile");
				if (!figure) return "";
				if (figure.classList.contains("codegroup")) {
					const tabs = figure.querySelectorAll("figcaption button");
					const index = [...figure.querySelectorAll("pre")].indexOf(pre);
					return tabs[index]?.textContent ?? "";
				}
				return figure.querySelector("figcaption")?.textContent ?? "";
			};

			/**
			 * Pick the Shiki language for a <pre>, or undefined to leave it plain.
			 *
			 * @example
			 * langFor(preWithCaption("sync.ts:80")); // 'typescript'
			 */
			const langFor = (pre) => {
				if (pre.dataset.lang) return LANG_BY_NAME[pre.dataset.lang];
				const extension = /\.([a-z0-9]+)(?::[\d-]+)?\s*$/i.exec(
					captionFor(pre),
				);
				return extension ? LANG_BY_NAME[extension[1].toLowerCase()] : undefined;
			};

			const escapeHtml = (text) =>
				text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

			const tokenStyle = ({ color, fontStyle = 0 }) => {
				const styles = [`color: ${color}`];
				if (fontStyle & ITALIC) styles.push("font-style: italic");
				if (fontStyle & BOLD) styles.push("font-weight: 600");
				if (fontStyle & UNDERLINE) styles.push("text-decoration: underline");
				return styles.join("; ");
			};

			const lineHtml = (tokens) =>
				tokens
					.map(
						(token) =>
							`<span style="${tokenStyle(token)}">${escapeHtml(token.content)}</span>`,
					)
					.join("");

			// Pick the code to color; printed output (`pre.out`, `pre.err`) stays plain
			const blocks = [...document.querySelectorAll("pre:not(.out):not(.err)")]
				.map((pre) => ({ lang: langFor(pre), pre }))
				.filter(({ lang }) => lang !== undefined);

			// Load only the languages this page uses
			const highlighter = await createHighlighterCore({
				engine: createJavaScriptRegexEngine(),
				langs: [...new Set(blocks.map(({ lang }) => lang))].map(
					(lang) => import(`@shikijs/langs/${lang}.mjs`),
				),
				themes: [import(`@shikijs/themes/${THEME}.mjs`)],
			});

			// Color each line in place, so `.line` spans and their classes survive
			for (const { lang, pre } of blocks) {
				const lineElements = [...pre.querySelectorAll(":scope > .line")];
				const code = lineElements.length
					? lineElements.map((line) => line.textContent).join("\n")
					: pre.textContent;
				const { tokens } = highlighter.codeToTokens(code, {
					lang,
					theme: THEME,
				});

				if (lineElements.length) {
					lineElements.forEach((line, index) => {
						line.innerHTML = lineHtml(tokens[index] ?? []);
					});
				} else {
					pre.innerHTML = tokens.map(lineHtml).join("\n");
				}
			}
		</script>

		<script>
			// Shared components: keep this script identical in the lesson and output-html templates.
			// It runs before the Shiki module, which colors each `.line` in place.

			// Wrap each line of <pre data-lines="2,3"> in a numbered `.line`; listed lines get `.hl`
			document.querySelectorAll("pre[data-lines]").forEach((pre) => {
				const marked = new Set(pre.dataset.lines.split(",").map(Number));
				pre.innerHTML = pre.innerHTML
					.split("\n")
					.map((line, index) => {
						const className = marked.has(index + 1) ? "line hl" : "line";
						return `<span class="${className}">${line}</span>`;
					})
					.join("");
			});

			// Code group tabs show one file at a time
			document.querySelectorAll(".codegroup").forEach((group) => {
				const tabs = [...group.querySelectorAll("figcaption button")];
				const files = [...group.querySelectorAll("pre")];
				tabs.forEach((tab, index) =>
					tab.addEventListener("click", () => {
						tabs.forEach((other) =>
							other.classList.toggle("active", other === tab),
						);
						files.forEach((file, fileIndex) => {
							file.hidden = fileIndex !== index;
						});
					}),
				);
			});

			// Copy buttons on `.cmd` blocks copy the command without its prompt
			document.querySelectorAll(".cmd .copy").forEach((button) =>
				button.addEventListener("click", () => {
					navigator.clipboard.writeText(button.dataset.copy);
				}),
			);
		</script>

		<script>
			// Put one menu toggle in the page header; on mobile it opens every nav.
			// Keep the toggle outside nav so lesson/tab selectors only find navigation items.
			document.addEventListener("DOMContentLoaded", () => {
				const navs = [...document.querySelectorAll("nav")];
				if (navs.length === 0) return;

				// Mark each nav as collapsible and give it an id for aria-controls
				navs.forEach((nav, index) => {
					nav.id ||= `page-navigation-${index}`;
					nav.classList.add("mobile-nav");
				});

				// Build the toggle and place it in the header, or above the first nav when there is no header
				const toggle = document.createElement("button");
				toggle.type = "button";
				toggle.className = "nav-toggle";
				toggle.innerHTML = '<span aria-hidden="true">☰</span> Menu';
				toggle.setAttribute(
					"aria-controls",
					navs.map((nav) => nav.id).join(" "),
				);
				toggle.setAttribute("aria-expanded", "false");
				const header = document.querySelector("body > header");
				if (header) header.append(toggle);
				else navs[0].before(toggle);

				// Open and close every nav together
				const isOpen = () => navs[0].classList.contains("open");
				const close = ({ restoreFocus = false } = {}) => {
					navs.forEach((nav) => nav.classList.remove("open"));
					document.body.classList.remove("nav-open");
					toggle.setAttribute("aria-expanded", "false");
					if (restoreFocus && getComputedStyle(toggle).display !== "none")
						toggle.focus();
				};

				toggle.addEventListener("click", () => {
					const expanded = !isOpen();
					navs.forEach((nav) => nav.classList.toggle("open", expanded));
					document.body.classList.toggle("nav-open", expanded);
					if (expanded) window.scrollTo(0, 0);
					toggle.setAttribute("aria-expanded", String(expanded));
				});
				navs.forEach((nav) =>
					nav.addEventListener("click", (event) => {
						if (event.target.closest("button, a"))
							close({ restoreFocus: true });
					}),
				);
				document.addEventListener("keydown", (event) => {
					if (event.key === "Escape" && isOpen()) close({ restoreFocus: true });
				});
				document.addEventListener("click", (event) => {
					const inMenu = navs.some((nav) => nav.contains(event.target));
					if (!inMenu && !toggle.contains(event.target)) close();
				});
				window.addEventListener("resize", () => close());
			});
		</script>
	</body>
