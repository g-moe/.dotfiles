<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Course page title</title>
		<style>
			:root {
				--bg: #ffffff;
				--panel: #f6f8fa;
				--line: #d0d7de;
				--text: #1f2328;
				--muted: #59636e;
				--accent: #0969da;
				--good: #1a7f37;
				--bad: #cf222e;
				--warn: #9a6700;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font:
					15.5px/1.7 system-ui,
					sans-serif;
			}
			header {
				padding: 28px 28px 0;
				max-width: 820px;
				margin: 0 auto;
			}
			h1 {
				margin: 0 0 6px;
				font-size: 26px;
				line-height: 1.25;
			}
			header p {
				margin: 0 0 18px;
				color: var(--muted);
			}
			nav {
				display: flex;
				gap: 2px;
				padding: 0 20px;
				border-bottom: 1px solid var(--line);
				flex-wrap: wrap;
				justify-content: center;
				max-width: 1020px;
				margin: 0 auto;
			}
			nav button {
				background: none;
				border: 0;
				border-bottom: 2px solid transparent;
				color: var(--muted);
				padding: 10px 8px;
				font: inherit;
				font-size: 14px;
				cursor: pointer;
			}
			nav button.active {
				color: var(--text);
				border-bottom-color: var(--accent);
			}
			section {
				display: none;
				padding: 24px 28px 64px;
				max-width: 820px;
				margin: 0 auto;
			}
			section.active {
				display: block;
			}
			h2 {
				font-size: 22px;
				margin: 40px 0 8px;
			}
			h3 {
				font-size: 17px;
				margin: 28px 0 6px;
			}
			p {
				margin: 0 0 14px;
			}
			pre {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 12px 14px;
				overflow-x: auto;
				font:
					13px/1.55 ui-monospace,
					monospace;
				margin: 0 0 16px;
			}
			code {
				font-family: ui-monospace, monospace;
				font-size: 13px;
				background: var(--panel);
				padding: 1px 5px;
				border-radius: 4px;
			}
			pre code {
				background: none;
				padding: 0;
			}
			ul,
			ol {
				margin: 6px 0 16px;
				padding-left: 22px;
			}
			li {
				margin: 4px 0;
			}
			.tok-c {
				color: #6e7781;
			}
			.tok-s {
				color: #0a3069;
			}
			.tok-k {
				color: #cf222e;
			}
			.tok-n {
				color: #0550ae;
			}
			.tok-f {
				color: #8250df;
			}
			.tok-t {
				color: #953800;
			}

			/* Blog furniture */
			.toc {
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 10px 16px;
				margin: 0 0 24px;
				font-size: 14px;
			}
			.toc b {
				display: block;
				color: var(--muted);
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				margin-bottom: 2px;
			}
			.toc a {
				color: var(--accent);
				text-decoration: none;
			}
			.toc ol {
				margin: 0;
				padding-left: 20px;
			}
			.learn {
				background: var(--panel);
				border-radius: 8px;
				padding: 12px 18px;
				margin: 0 0 20px;
			}
			.learn ul {
				margin: 4px 0 0;
			}
			.ask {
				display: flex;
				gap: 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 12px 14px;
				margin: 0 0 16px;
			}
			.ask .who {
				font-size: 20px;
				line-height: 1.2;
			}
			.ask > div:last-child {
				min-width: 0;
			}
			.ask p {
				margin: 0 0 6px;
			}
			.ask p:last-child {
				margin: 0;
			}
			.ask .q {
				font-weight: 600;
				margin-bottom: 4px;
			}
			.ask pre {
				margin: 6px 0 8px;
			}
			.note {
				border-left: 3px solid var(--accent);
				background: #ddf4ff;
				padding: 10px 14px;
				border-radius: 0 8px 8px 0;
				margin: 0 0 16px;
				font-size: 14.5px;
			}
			.file {
				font:
					12px ui-monospace,
					monospace;
				color: var(--muted);
				margin: 0 0 4px;
			}
			pre.out {
				background: var(--bg);
				border-style: dashed;
			}
			pre.err {
				background: #fff8f8;
				border-color: #ffcecb;
			}
			.term {
				font:
					12px ui-monospace,
					monospace;
				color: var(--muted);
				margin: 0 0 4px;
			}

			/* Code switch (tabs between alternative code blocks) */
			.switch {
				margin: 0 0 16px;
			}
			.switch .tabs {
				display: flex;
				gap: 2px;
			}
			.switch .tabs button {
				border: 1px solid var(--line);
				border-bottom: 0;
				background: var(--bg);
				color: var(--muted);
				font:
					12px ui-monospace,
					monospace;
				padding: 4px 10px;
				border-radius: 6px 6px 0 0;
				cursor: pointer;
			}
			.switch .tabs button.on {
				background: var(--panel);
				color: var(--text);
			}
			.switch pre {
				border-top-left-radius: 0;
				margin: 0;
			}
			.switch pre[hidden] {
				display: none;
			}

			/* Exercise and next lesson */
			.exercise {
				border: 1px solid var(--line);
				border-left: 3px solid var(--good);
				border-radius: 0 8px 8px 0;
				padding: 12px 16px;
				margin: 0 0 20px;
			}
			.exercise > p:first-child {
				font-weight: 600;
			}
			.exercise details {
				margin-top: 6px;
			}
			.exercise summary {
				cursor: pointer;
				color: var(--accent);
				font-size: 14px;
				font-weight: 600;
				margin-bottom: 10px;
			}
			.next {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 12px 16px;
				margin-top: 24px;
				background: var(--panel);
			}
			.next p {
				margin: 0;
			}

			/* Widgets */
			.widget {
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 16px;
				margin: 4px 0 20px;
				background: #fbfcfd;
			}
			.widget .hint {
				font-size: 13px;
				color: var(--muted);
				margin: 0 0 10px;
			}
			.widget pre {
				margin: 0 0 10px;
			}
			.row {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				align-items: center;
				margin-bottom: 10px;
			}
			.btn {
				border: 1px solid var(--line);
				background: var(--bg);
				border-radius: 6px;
				padding: 5px 12px;
				font: inherit;
				font-size: 13.5px;
				cursor: pointer;
			}
			.btn:hover {
				border-color: var(--accent);
			}
			.btn.primary {
				background: var(--accent);
				color: #fff;
				border-color: var(--accent);
			}
			.btn.on {
				background: #ddf4ff;
				border-color: var(--accent);
				color: var(--accent);
			}
			.btn:disabled {
				opacity: 0.45;
				cursor: default;
			}
			.btn code {
				background: none;
				padding: 0;
			}
			.seg {
				display: inline-flex;
				flex-wrap: wrap;
				gap: 4px;
				vertical-align: middle;
			}
			.seg button {
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--bg);
				padding: 4px 10px;
				font:
					13px ui-monospace,
					monospace;
				cursor: pointer;
			}
			.seg button:hover {
				border-color: var(--accent);
			}
			.seg button.on {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			.status {
				font-size: 14px;
				background: var(--panel);
				border-radius: 6px;
				padding: 8px 10px;
				min-height: 40px;
			}
			.status pre {
				margin: 8px 0 0;
			}
			.counter {
				font-size: 12px;
				color: var(--muted);
				margin-left: auto;
			}
			.bad {
				color: var(--bad);
				font-weight: 600;
			}
			.ok {
				color: var(--good);
				font-weight: 600;
			}
			.empty {
				color: var(--muted);
				font-size: 13px;
				font-style: italic;
			}
			.stats {
				display: flex;
				gap: 16px;
				font-size: 13px;
				color: var(--muted);
				margin-top: 8px;
				flex-wrap: wrap;
			}
			.stats b {
				color: var(--text);
				font-size: 15px;
			}

			/* Code with per-line highlighting (steppers) */
			.lines .ln {
				display: block;
				padding: 0 6px;
				margin: 0 -6px;
				border-radius: 4px;
				transition:
					background 0.2s,
					opacity 0.2s;
			}
			.lines .ln.on {
				background: #fff8c5;
			}
			.lines .ln.dim {
				opacity: 0.35;
			}
			.lines .ln.bad {
				background: #ffebe9;
				color: inherit;
				font-weight: inherit;
			}
			.lines .ln.good {
				background: #dafbe1;
			}
			.lesson-tag {
				display: inline-block;
				font-size: 11px;
				background: #ddf4ff;
				color: var(--accent);
				border-radius: 10px;
				padding: 0 8px;
				margin-left: 6px;
				font-weight: 600;
				vertical-align: 1px;
			}

			/* Shared mobile breakpoint: use 640px for all mobile layout rules. */
			.nav-toggle {
				display: none;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--bg);
				color: var(--text);
				padding: 10px 14px;
				margin: 12px 20px;
				font: inherit;
				cursor: pointer;
			}
			@media (max-width: 640px) {
				.nav-toggle {
					display: inline-flex;
					align-items: center;
					gap: 8px;
				}
				nav.mobile-nav {
					display: none;
					flex-direction: column;
					align-items: stretch;
				}
				nav.mobile-nav.open {
					display: flex;
				}
				nav.mobile-nav button {
					text-align: left;
				}
				header {
					padding: 20px 16px 0;
				}
				section {
					padding: 20px 16px 40px;
				}
			}
			@media print {
				.nav-toggle {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<!-- Insert the course header, group pills, lesson tabs and lesson sections here. -->
		<!-- Inline the navigation code and group widget scripts after the sections. -->

		<script>
			// Keep the toggle outside nav so lesson/tab selectors only find navigation items.
			document.addEventListener("DOMContentLoaded", () => {
				document.querySelectorAll("nav").forEach((nav, index) => {
					const toggle = document.createElement("button");
					toggle.type = "button";
					toggle.className = "nav-toggle";
					toggle.innerHTML = '<span aria-hidden="true">☰</span> Menu';
					nav.id ||= `page-navigation-${index}`;
					nav.classList.add("mobile-nav");
					toggle.setAttribute("aria-controls", nav.id);
					toggle.setAttribute("aria-expanded", "false");
					nav.before(toggle);

					const close = ({ restoreFocus = false } = {}) => {
						nav.classList.remove("open");
						toggle.setAttribute("aria-expanded", "false");
						if (restoreFocus && getComputedStyle(toggle).display !== "none")
							toggle.focus();
					};

					toggle.addEventListener("click", () => {
						const expanded = nav.classList.toggle("open");
						toggle.setAttribute("aria-expanded", String(expanded));
					});
					nav.addEventListener("click", (event) => {
						if (event.target.closest("button, a"))
							close({ restoreFocus: true });
					});
					document.addEventListener("keydown", (event) => {
						if (event.key === "Escape" && nav.classList.contains("open"))
							close({ restoreFocus: true });
					});
					document.addEventListener("click", (event) => {
						if (!nav.contains(event.target) && !toggle.contains(event.target))
							close();
					});
					window.addEventListener("resize", () => close());
				});
			});
		</script>
	</body>
</html>
